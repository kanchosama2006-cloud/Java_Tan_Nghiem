<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caro 3x3</title>
  <script>
    // Trang goc: da dang nhap thi vao game, chua thi vao trang dang nhap
    fetch('/api/auth/me', { credentials: 'same-origin' })
      .then(r => { location.replace(r.ok ? 'game.html' : 'login.html'); })
      .catch(() => { location.replace('login.html'); });
  </script>
</head>
