<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Bảng Xếp Hạng - Grandmaster Arena</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="nav"></header>

  <main class="container">
    <section class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h2 style="margin-bottom: 0;">BẢNG XẾP HẠNG KỲ THỦ</h2>
        <button id="btnReloadLeaderboard" class="btn small light" type="button">Làm Mới</button>
      </div>
      <div id="alert" class="alert"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="num" style="width: 80px;">HẠNG</th>
              <th>TÀI KHOẢN</th>
              <th>HỌ VÀ TÊN</th>
              <th class="num">TỔNG SỐ VÁN</th>
              <th class="num">X THẮNG</th>
              <th class="num">O THẮNG</th>
              <th class="num">HÒA</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script>
    (async function () {
      await initPage('leaderboard');
      const rows = $('rows');
      const alertBox = $('alert');

      async function loadLeaderboard() {
        hideAlert(alertBox);
        rows.innerHTML = renderSkeletonRows(7, 5);

        try {
          const list = await api('/api/leaderboard');

          if (!list || list.length === 0) {
            rows.innerHTML = renderEmptyState(7, {
              title: 'Chưa Có Kỳ Thủ Nào',
              desc: 'Hệ thống chưa ghi nhận ván cờ nào hoàn thành. Hãy là người đầu tiên ghi danh trên bảng xếp hạng!',
              actionText: 'Bắt Đầu Chơi Cờ',
              actionHref: 'game.html'
            });
            return;
          }

          rows.innerHTML = list.map((r) => {
            let rankBadge = `<span style="font-family:'Orbitron',monospace; font-weight:700; color:var(--text-muted);">#${r.rank}</span>`;
            if (r.rank === 1) rankBadge = `<span style="font-family:'Orbitron',monospace; font-weight:800; color:#fef08a; padding: 2px 8px; background: rgba(212,175,55,0.2); border:1px solid #d4af37; border-radius:4px;">TOP 1</span>`;
            if (r.rank === 2) rankBadge = `<span style="font-family:'Orbitron',monospace; font-weight:800; color:#e2e8f0; padding: 2px 8px; background: rgba(226,232,240,0.15); border:1px solid #cbd5e1; border-radius:4px;">TOP 2</span>`;
            if (r.rank === 3) rankBadge = `<span style="font-family:'Orbitron',monospace; font-weight:800; color:#f59e0b; padding: 2px 8px; background: rgba(245,158,11,0.15); border:1px solid #f59e0b; border-radius:4px;">TOP 3</span>`;

            return `
              <tr>
                <td class="num">${rankBadge}</td>
                <td><b>${esc(r.username)}</b></td>
                <td>${esc(r.fullName)}</td>
                <td class="num" style="font-family:'Orbitron',monospace; font-weight:700; color:#fff;">${r.totalGames}</td>
                <td class="num" style="color:var(--x-color); font-weight:600; font-family:'Orbitron',monospace;">${r.xWins}</td>
                <td class="num" style="color:var(--o-color); font-weight:600; font-family:'Orbitron',monospace;">${r.oWins}</td>
                <td class="num" style="color:var(--draw-color); font-weight:600; font-family:'Orbitron',monospace;">${r.draws}</td>
              </tr>
            `;
          }).join('');
        } catch (e) {
          showToast(errText(e), 'error');
          rows.innerHTML = renderErrorState(7, {
            title: 'Lỗi Tải Bảng Xếp Hạng',
            desc: errText(e),
            retryId: 'btnRetryLeaderboard'
          });
          const retry = $('btnRetryLeaderboard');
          if (retry) retry.onclick = loadLeaderboard;
        }
      }

      $('btnReloadLeaderboard').onclick = loadLeaderboard;
      loadLeaderboard();
    })();
  </script>
</body>
</html>
