<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Đấu Trường Caro - Grandmaster Arena</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="nav"></header>

  <div class="arena-split-container">
    <!-- LEFT COLUMN: CONTROLS & CONFIGURATION PANEL -->
    <aside class="arena-controls-panel">
      <!-- OPPONENT & CONFIGURATION CARD -->
      <div class="card" style="margin-bottom: 0;">
        <div class="arena-section-title">CHẾ ĐỘ THI ĐẤU</div>
        <div style="margin-bottom: 16px;">
          <select id="opponentType">
            <option value="PVP">2 Người (Chung máy)</option>
            <option value="BOT_EASY">Đấu với Máy: AI Tân Thủ (Dễ)</option>
            <option value="BOT_MEDIUM">Đấu với Máy: AI Chiến Binh (Vừa)</option>
            <option value="BOT_HARD">Đấu với Máy: AI Đại Kiện Tướng (Khó)</option>
            <option value="ONLINE">Chơi Online (2 Thiết bị)</option>
          </select>
        </div>

        <div class="arena-section-title">QUY MÔ BÀN CỜ</div>
        <div style="margin-bottom: 16px;">
          <select id="boardSizeSelect">
            <option value="3" selected>Bàn Cờ 3x3 (3 quân liên tiếp)</option>
            <option value="5">Bàn Cờ 5x5 (4 quân liên tiếp)</option>
            <option value="10">Bàn Cờ 10x10 (5 quân - Chuẩn Caro)</option>
          </select>
        </div>

        <!-- SẢNH PHÒNG ONLINE -->
        <div id="onlineLobby" class="online-lobby-card" style="display: none; margin-top: 14px;">
          <div class="arena-section-title" style="color: #38bdf8;">PHÒNG THI ĐẤU TRỰC TUYẾN</div>

          <div id="lobbyActions">
            <div style="margin-bottom: 14px;">
              <button id="btnCreateOnlineRoom" class="btn" type="button" style="width: 100%;">Tạo Phòng Mới</button>
            </div>
            <div style="margin-bottom: 14px;">
              <label for="joinRoomInput" style="font-size: 0.85rem;">Nhập mã phòng 6 ký tự:</label>
              <div style="display: flex; gap: 8px;">
                <input id="joinRoomInput" type="text" maxlength="6" placeholder="CARO89" style="text-transform: uppercase; margin-bottom: 0;">
                <button id="btnJoinRoomCode" class="btn light small" type="button">Vào</button>
              </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <span style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted);">Phòng đang chờ:</span>
              <button id="btnRefreshWaitingRooms" class="btn ghost small" type="button" style="padding: 4px 8px; font-size: 0.75rem;">Làm mới</button>
            </div>
            <div class="table-wrap" style="max-height: 180px; overflow-y: auto;">
              <table>
                <thead>
                  <tr>
                    <th>Mã</th>
                    <th>Chủ</th>
                    <th>Bàn</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="waitingRoomRows">
                  <tr><td colspan="4" class="empty">Đang tải...</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <div id="activeRoomInfo" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
              <div>
                <span style="font-size: 0.75rem; color: var(--text-muted); display: block;">Mã phòng:</span>
                <span id="activeRoomCode" style="font-family: 'Orbitron', monospace; font-size: 1.1rem; font-weight: 700; color: #38bdf8;">------</span>
              </div>
              <div style="display: flex; gap: 6px;">
                <button id="btnCopyRoomCode" class="btn small ghost" type="button">Sao Chép</button>
                <button id="btnLeaveRoom" class="btn small danger" type="button">Rời</button>
              </div>
            </div>
            <div id="onlineRoleBanner" class="online-role-banner" style="font-size: 0.9rem; padding: 8px 12px;">
              <span id="myRoleText">Đang kết nối...</span>
              <span id="roomStatusBadge" class="badge">Đang chờ</span>
            </div>
          </div>
        </div>

        <!-- TÊN KỲ THỦ -->
        <div id="playerInputsRow" style="margin-top: 14px;">
          <div style="margin-bottom: 12px;">
            <label for="playerX" style="font-size: 0.82rem;">Kỳ Thủ X (Đi trước)</label>
            <input id="playerX" type="text" maxlength="50" value="Kỳ thủ X">
          </div>
          <div>
            <label for="playerO" style="font-size: 0.82rem;">Kỳ Thủ O (Đi sau)</label>
            <input id="playerO" type="text" maxlength="50" value="Kỳ thủ O">
          </div>
        </div>

        <!-- LUẬT CHƠI CHO BÀN 3x3 -->
        <div id="ruleModeWrap" style="margin-top: 16px;">
          <div class="arena-section-title">QUY TẮC BÀN 3X3</div>
          <div class="segmented-group">
            <button id="btnModeInfinite" class="segmented-btn active" type="button">Vô Tận (3 Quân)</button>
            <button id="btnModeClassic" class="segmented-btn" type="button">Cổ Điển</button>
          </div>
          <div id="modeTip" class="mode-tip" style="margin-top: 8px; font-size: 0.82rem;">
            <b>Luật Vô Tận:</b> Mỗi bên tối đa 3 quân. Khi đánh quân thứ 4, quân thứ 1 sẽ biến mất.
          </div>
        </div>

        <div style="margin-top: 20px;">
          <button id="btnNew" class="btn" type="button" style="width: 100%;">Bắt Đầu Ván Mới</button>
        </div>
      </div>

      <!-- MINI STATS CARD -->
      <div class="card" style="margin-bottom: 0;">
        <div class="arena-section-title">THỐNG KÊ SỰ NGHIỆP</div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div style="background: rgba(15,23,42,0.6); padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.06);">
            <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700;">TỔNG VÁN</div>
            <div id="sTotal" style="font-family: 'Orbitron', monospace; font-size: 1.4rem; font-weight: 700; color: #fff;">0</div>
          </div>
          <div style="background: rgba(15,23,42,0.6); padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.06);">
            <div style="font-size: 0.75rem; color: #f43f5e; font-weight: 700;">X THẮNG</div>
            <div id="sX" style="font-family: 'Orbitron', monospace; font-size: 1.4rem; font-weight: 700; color: #f43f5e;">0</div>
          </div>
          <div style="background: rgba(15,23,42,0.6); padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.06);">
            <div style="font-size: 0.75rem; color: #06b6d4; font-weight: 700;">O THẮNG</div>
            <div id="sO" style="font-family: 'Orbitron', monospace; font-size: 1.4rem; font-weight: 700; color: #06b6d4;">0</div>
          </div>
          <div style="background: rgba(15,23,42,0.6); padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.06);">
            <div style="font-size: 0.75rem; color: #fbbf24; font-weight: 700;">HÒA</div>
            <div id="sDraw" style="font-family: 'Orbitron', monospace; font-size: 1.4rem; font-weight: 700; color: #fbbf24;">0</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- RIGHT COLUMN: ARENA BOARD STAGE -->
    <main class="arena-board-stage">
      <div id="status" class="status" style="margin-bottom: 24px;"></div>
      <div id="board" class="board board-3"></div>
      <div id="msg" class="alert" style="margin-top: 20px; width: 100%; max-width: 500px;"></div>
    </main>
  </div>

  <script src="js/common.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
