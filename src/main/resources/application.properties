spring.application.name=caro_db
server.port=8080

# ===== Ket noi MySQL (sua username / password cho dung may cua ban) =====
spring.datasource.url=jdbc:mysql://localhost:3306/caro_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# ===== JPA / Hibernate =====
# update: tu tao hoac cap nhat bang theo cac lop Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Thoi gian dang ISO (2026-10-08T13:50:00), khong phai so
spring.jackson.serialization.write-dates-as-timestamps=false

# Thoi gian song cua phien dang nhap
server.servlet.session.timeout=60m

# ===== Google OAuth 2.0 (Identity Services) =====
# Cai dat bang bien moi truong GOOGLE_CLIENT_ID (vi du: 123456789-abc.apps.googleusercontent.com)
caro.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
