<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng Nhập & Đăng Ký - Grandmaster Arena</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-header">
      <div class="confirm-crest" style="margin-bottom: 12px;"></div>
      <h1 style="letter-spacing: 2px;">GRANDMASTER ARENA</h1>
      <p class="sub">Đấu Trường Trí Tuệ & Cờ Caro Nghệ Thuật</p>
    </div>

    <div class="card">
      <div class="tabs">
        <button id="tabLogin" class="active" type="button">Đăng nhập</button>
        <button id="tabRegister" type="button">Đăng ký tài khoản</button>
      </div>

      <div id="alert" class="alert"></div>

      <!-- FORM ĐĂNG NHẬP -->
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="lUser">Tên đăng nhập</label>
          <input id="lUser" type="text" autocomplete="username" placeholder="Nhập username...">
          <div id="errLUser" class="field-error"></div>
        </div>

        <div class="form-group">
          <label for="lPass">Mật khẩu</label>
          <input id="lPass" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu...">
          <div id="errLPass" class="field-error"></div>
        </div>

        <button id="btnLoginSubmit" class="btn" style="width:100%" type="submit">Đăng nhập ngay</button>
      </form>

      <!-- FORM ĐĂNG KÝ -->
      <form id="registerForm" style="display:none" novalidate>
        <div class="form-group">
          <label for="rName">Họ và tên</label>
          <input id="rName" type="text" placeholder="Nguyễn Văn A">
          <div id="errRName" class="field-error"></div>
        </div>

        <div class="form-group">
          <label for="rUser">Tên đăng nhập</label>
          <input id="rUser" type="text" autocomplete="username" placeholder="Chỉ chứa chữ và số">
          <div id="errRUser" class="field-error"></div>
        </div>

        <div class="form-group">
          <label for="rPass">Mật khẩu (từ 6 ký tự)</label>
          <input id="rPass" type="password" autocomplete="new-password" placeholder="Tối thiểu 6 ký tự">
          <div id="errRPass" class="field-error"></div>
        </div>

        <button id="btnRegisterSubmit" class="btn" style="width:100%" type="submit">Tạo tài khoản mới</button>
      </form>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    const alertBox = $('alert');
    const loginForm = $('loginForm');
    const registerForm = $('registerForm');

    function showTab(isLogin) {
      loginForm.style.display = isLogin ? 'block' : 'none';
      registerForm.style.display = isLogin ? 'none' : 'block';
      $('tabLogin').className = isLogin ? 'active' : '';
      $('tabRegister').className = isLogin ? '' : 'active';
      hideAlert(alertBox);
      clearValidationErrors();
    }

    function clearValidationErrors() {
      ['lUser', 'lPass', 'rName', 'rUser', 'rPass'].forEach(id => {
        const input = $(id);
        const err = $('err' + id.charAt(0).toUpperCase() + id.slice(1));
        if (input && err) setFieldError(input, err, '');
      });
    }

    $('tabLogin').onclick = () => showTab(true);
    $('tabRegister').onclick = () => showTab(false);

    // Luồng Form Đăng Nhập
    loginForm.onsubmit = async (ev) => {
      ev.preventDefault();
      hideAlert(alertBox);
      clearValidationErrors();

      const user = $('lUser').value.trim();
      const pass = $('lPass').value;
      let hasError = false;

      // Client validation
      if (!user) {
        setFieldError($('lUser'), $('errLUser'), 'Vui lòng nhập tên đăng nhập');
        hasError = true;
      }
      if (!pass) {
        setFieldError($('lPass'), $('errLPass'), 'Vui lòng nhập mật khẩu');
        hasError = true;
      }
      if (hasError) return;

      const submitBtn = $('btnLoginSubmit');
      setButtonLoading(submitBtn, true, 'Đang đăng nhập...');

      try {
        await api('/api/auth/login', {
          method: 'POST',
          body: { username: user, password: pass }
        });
        showToast('Đăng nhập thành công! Đang chuyển hướng...', 'success');
        setTimeout(() => { location.replace('game.html'); }, 400);
      } catch (e) {
        setButtonLoading(submitBtn, false);
        showToast(errText(e), 'error');
        showAlert(alertBox, 'error', errText(e));
      }
    };

    // Luồng Form Đăng Ký
    registerForm.onsubmit = async (ev) => {
      ev.preventDefault();
      hideAlert(alertBox);
      clearValidationErrors();

      const name = $('rName').value.trim();
      const user = $('rUser').value.trim();
      const pass = $('rPass').value;
      let hasError = false;

      // Client validation
      if (!name) {
        setFieldError($('rName'), $('errRName'), 'Họ và tên không được để trống');
        hasError = true;
      }
      if (!user) {
        setFieldError($('rUser'), $('errRUser'), 'Tên đăng nhập không được để trống');
        hasError = true;
      } else if (user.length < 3) {
        setFieldError($('rUser'), $('errRUser'), 'Tên đăng nhập tối thiểu 3 ký tự');
        hasError = true;
      }
      if (!pass) {
        setFieldError($('rPass'), $('errRPass'), 'Mật khẩu không được để trống');
        hasError = true;
      } else if (pass.length < 6) {
        setFieldError($('rPass'), $('errRPass'), 'Mật khẩu phải từ 6 ký tự trở lên');
        hasError = true;
      }
      if (hasError) return;

      const submitBtn = $('btnRegisterSubmit');
      setButtonLoading(submitBtn, true, 'Đang đăng ký...');

      try {
        await api('/api/auth/register', {
          method: 'POST',
          body: { fullName: name, username: user, password: pass }
        });
        setButtonLoading(submitBtn, false);
        showToast('Đăng ký tài khoản thành công! Hãy đăng nhập.', 'success');
        showAlert(alertBox, 'success', 'Đăng ký thành công! Bạn có thể đăng nhập ngay.');
        showTab(true);
        $('lUser').value = user;
        $('lPass').value = '';
      } catch (e) {
        setButtonLoading(submitBtn, false);
        showToast(errText(e), 'error');
        showAlert(alertBox, 'error', errText(e));
      }
    };
  </script>
</body>
</html>
